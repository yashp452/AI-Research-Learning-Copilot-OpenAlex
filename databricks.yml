bundle:
  name: research-copilot

variables:
  app_name:
    description: Name of the Databricks App
    default: lakebase-app-yash

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-8b028016-8196.cloud.databricks.com
    variables:
      app_name: lakebase-app-yash-dev
    # After deployment, grant volume access:
    # GRANT READ VOLUME ON VOLUME workspace.research_copilot.raw TO `6faa8167-0a98-40c9-8e78-ae3173cbd9eb`;
  
  prod:
    mode: production
    workspace:
      host: https://dbc-8b028016-8196.cloud.databricks.com
      # To deploy to a different workspace, change host:
      # host: https://your-prod-workspace.cloud.databricks.com
    variables:
      app_name: lakebase-app-yash
    # After deployment to new workspace, grant volume access:
    # GRANT READ VOLUME ON VOLUME workspace.research_copilot.raw TO `<prod-app-service-principal-id>`;

resources:
  apps:
    research_copilot_app:
      name: ${var.app_name}
      description: AI Research & Learning Copilot with OpenAlex corpus and Lakebase PostgreSQL
      source_code_path: ./app
