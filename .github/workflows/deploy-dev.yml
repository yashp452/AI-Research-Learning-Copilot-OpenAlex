name: Deploy to Dev

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

env:
  APP_NAME: lakebase-app-yash-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Resolve workspace paths
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -euo pipefail
          USER_NAME=$(databricks current-user me --output json | jq -r .userName)
          echo "Authenticated as $USER_NAME"
          # Use shared deployment location instead of user-specific
          echo "TARGET_PATH=/Workspace/Shared/apps/ci-cd/${APP_NAME}" >> "$GITHUB_ENV"

      - name: Sync app source to workspace
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -euo pipefail
          echo "Syncing ./app -> ${TARGET_PATH}"
          databricks sync ./app "${TARGET_PATH}" --full

      - name: Deploy app
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -euo pipefail
          databricks apps deploy "${APP_NAME}" \
            --source-code-path "${TARGET_PATH}"

      - name: Report status
        if: always()
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks apps get "${APP_NAME}" --output json > status.json || true

          {
            echo "### Dev App Deployment"
            echo ""
            echo "- App: \`${APP_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Source: \`${TARGET_PATH}\`"
            if [ -s status.json ]; then
              echo "- State: \`$(jq -r '.compute_status.state // "unknown"' status.json)\`"
              echo "- URL: $(jq -r '.url // "unknown"' status.json)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"